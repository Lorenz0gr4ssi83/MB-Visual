# Server delle licenze MB Desk su Cloudflare Workers (piano gratuito)
# Messa online:  npx wrangler@4 deploy   (dalla copia in %USERPROFILE%\.mbvisual\server, vedi tools/license_setup.py)
# Segreti (mai nel repository): SIGNING_KEY (chiave privata Ed25519), ADMIN_TOKEN (accesso dell'app di gestione)
# indirizzo https://mbdesk.mb-group.workers.dev (dal 25/10/2026). Il Worker con il nome precedente "mbvisual" resta acceso
# per i telefoni gia' installati su quell'indirizzo: tools/publish_web.py pubblica lo stesso codice anche li', senza cron.
name = "mbdesk"
main = "src/index.js"
compatibility_date = "2026-09-01"

# app per cellulari: file statici serviti dal Worker solo ai dispositivi attivati (tools/build_web.py --mobile)
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# controllo giornaliero delle licenze in scadenza o scadute (avvisi e notifiche)
[triggers]
crons = ["0 6 * * *"]

[vars]
PUBLIC_KEY = "__PUBLIC_KEY__"
# repository pubblico dei soli setup: /scarica lo consegna attraverso il server (nell'indirizzo non compare il nome)
RELEASES_REPO = "Lorenz0gr4ssi83/MB-Visual-Rilasci"
# impronta (pubblica) del certificato che firma l'app Android: /.well-known/assetlinks.json
# "1" quando l'APK e' nella release: la pagina del QR propone l'app Android prima della versione web
ANDROID_APK = "1"
ANDROID_CERT_SHA256 = "70:E0:46:FC:C1:96:E2:B3:D1:68:A4:75:71:95:80:E3:66:53:CD:1B:1C:01:01:C2:F8:0D:83:8D:E7:06:BF:E2"

[[d1_databases]]
binding = "DB"
database_name = "mbvisual-licenze"
database_id = "__DATABASE_ID__"

# collegamento PC-telefono in tempo reale (src/link.js): una stanza per PC, WebSocket in ibernazione, nessun dato salvato
[[durable_objects.bindings]]
name = "LINK"
class_name = "LinkRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LinkRoom"]
