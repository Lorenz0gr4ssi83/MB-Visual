<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>MB Visual Admin</title>
<style>
  :root { --bg: #17191b; --panel: #1f2224; --panel2: #26292c; --fg: #e6e8e5; --muted: #9ea29b; --line: #34383b; --accent: #6aa7d8; --ok: #5cb85c; --bad: #e0605a; --warn: #e3a33b; }
  *, *::before, *::after { box-sizing: border-box; cursor: default !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px "Segoe UI", system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header { display: flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header b { font-size: 15px; margin-right: 14px; }
  .tab { background: none; border: 1px solid transparent; color: var(--fg); padding: 6px 12px; border-radius: 6px; font: inherit; }
  .tab.on { background: var(--panel2); border-color: var(--line); }
  .badge { background: var(--bad); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
  .grow { flex: 1; } .muted { color: var(--muted); }
  main { overflow: auto; padding: 16px 18px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .card .n { font-size: 26px; font-weight: 600; } .card .l { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--panel2); font-weight: 600; color: var(--muted); font-size: 12px; }
  tr.sub td { background: var(--bg); font-size: 12px; }
  .mono { font-family: Consolas, monospace; letter-spacing: .02em; }
  button.b { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 4px 9px; font: inherit; font-size: 12px; margin: 0 4px 2px 0; }
  button.b:hover { border-color: var(--accent); } button.p { background: var(--accent); color: #0d1b26; border-color: var(--accent); } button.d { color: var(--bad); }
  .st { font-size: 11px; padding: 1px 7px; border-radius: 9px; border: 1px solid; }
  .st.active, .st.done { color: var(--ok); } .st.revoked, .st.closed { color: var(--muted); } .st.replaced { color: var(--warn); } .st.pending, .st.open { color: var(--bad); }
  form.new { display: grid; grid-template-columns: 2fr 2fr 1fr 1fr 2fr auto; gap: 8px; align-items: end; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 14px; }
  label { display: grid; gap: 3px; color: var(--muted); font-size: 12px; }
  input, select { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; font: inherit; }
  .ev { display: grid; grid-template-columns: 120px 180px 1fr; gap: 10px; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  .ev.unread { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 6px; display: none; }
  .err { color: var(--bad); }
  .mback { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 20; }
  .modal { width: min(560px, 94vw); max-height: 90vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 10px; }
  .modal .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .modal label input, .modal label textarea { width: 100%; }
  textarea { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; font: inherit; }
  .pick { border: 1px solid var(--warn); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; }
  .pick label, .nsw { display: flex; gap: 8px; align-items: center; color: var(--fg); font-size: 13px; }
  .nsw { padding: 3px 0; }
  .modal .pick label input, .nsw input { width: auto; flex: none; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); color: var(--muted); padding: 5px 12px; font: inherit; }
  .seg button.on { background: var(--accent); color: #0d1b26; font-weight: 600; }
  details.grp { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  details.grp > summary { display: flex; align-items: center; gap: 10px; padding: 9px 12px; font-weight: 600; background: var(--panel2); }
  details.grp > summary .n { color: var(--muted); font-weight: 400; }
  details.grp > summary .grow { flex: 1; }
  #toast .undo { margin-left: 10px; background: none; border: 0; color: var(--accent); font-weight: 700; font: inherit; }
  tr.picked td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  textarea.mail { width: 100%; min-height: 260px; font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
  .modal .row2 { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .pair { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
  .pair .qr { background: #fff; padding: 10px; border-radius: 8px; line-height: 0; }
  .pair .qr svg * { stroke: none !important; }
  .pair .code { font: 600 30px Consolas, monospace; letter-spacing: .18em; }
  h3 { margin: 0 0 10px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <b>MB Visual Admin</b>
  <button class="tab on" data-v="panoramica">Panoramica</button>
  <button class="tab" data-v="licenze">Licenze</button>
  <button class="tab" data-v="richieste">Richieste <span id="nreq"></span></button>
  <button class="tab" data-v="impostazioni">Impostazioni</button>
  <span class="grow"></span>
  <span class="muted" id="conn"></span>
  <button class="b" onclick="adminRefresh()">Aggiorna</button>
</header>
<main id="main"></main>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = s => s ? new Date(s.replace(" ", "T") + "Z").toLocaleString("it-IT", { dateStyle: "short", timeStyle: "short" }) : "";
const KIND = { activation: "Attivazione", activation_pc: "Nuovo PC attivato", activation_mobile: "Nuovo cellulare attivato", expiring: "Licenza in scadenza", expired: "Licenza scaduta", change: "Cambio dispositivo", change_pending: "Cambio DA APPROVARE", report: "Segnalazione", limit: "Limite raggiunto", invalid_key: "Chiave non valida", revoked_use: "Licenza non valida in uso", admin_login: "Accesso dal telefono" };
const NOTIFY = { activation_pc: "Nuova attivazione di un PC", activation_mobile: "Nuova attivazione di un cellulare", change: "Cambio dispositivo (chiave nuova generata)",
  change_pending: "Cambio oltre il limite da approvare", report: "Segnalazione dall'app", expiring: "Licenza in scadenza (15 giorni prima)", expired: "Licenza scaduta",
  limit: "Tentativi oltre il limite di dispositivi", invalid_key: "Tentativi con chiave non valida o sostituita", revoked_use: "Uso di una licenza revocata o scaduta",
  admin_login: "Accesso alla gestione da un telefono" };
const STATO = { active: "attiva", revoked: "revocata", replaced: "sostituita", open: "aperta", pending: "in attesa", done: "completata", closed: "chiusa" };
let view = "panoramica", data = {};
const pref = (k, d) => { try { return JSON.parse(localStorage.getItem("mbva-" + k)) ?? d; } catch { return d; } };
const setPref = (k, v) => { try { localStorage.setItem("mbva-" + k, JSON.stringify(v)); } catch {} };
let evMode = pref("gruppi", "giorno"), evType = "", evArch = false, openGroups = new Set(pref("aperti", [])), sortBy = pref("ordina", "created"), sortDir = pref("verso", -1),
  licFilter = "", licQuery = "", showAll = false, picked = new Set(), hiddenKeys = new Set();
function toast(t, bad) { const e = $("#toast"); e.textContent = t; e.className = bad ? "err" : ""; e.style.display = "block"; clearTimeout(e._h); e._h = setTimeout(() => (e.style.display = "none"), 3500); }
function undoToast(text, onCommit, onUndo, secs = 6) {
  const e = $("#toast"); clearTimeout(e._h); e.className = ""; e.style.display = "block";
  let left = secs, done = false;
  const draw = () => { e.innerHTML = `${esc(text)} <span class="muted">(${left})</span><button class="undo">Annulla</button>`; e.querySelector(".undo").onclick = () => { if (done) return; done = true; clearInterval(t); e.style.display = "none"; onUndo(); }; };
  draw();
  const t = setInterval(() => { left--; if (left > 0) return draw(); clearInterval(t); if (done) return; done = true; e.style.display = "none"; onCommit(); }, 1000);
}
async function call(m, p, b) { const r = await window.pywebview.api.call(m, p, b ?? null); if (r && r.ok === false) throw new Error(r.errore || "Errore"); return r; }
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { view = t.dataset.v; document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t)); render(); });

async function adminRefresh() {
  try {
    const [s, l, r, e] = await Promise.all([call("GET", "/admin/summary"), call("GET", "/admin/licenses"), call("GET", "/admin/requests"), call("GET", "/admin/events?after=0" + (evArch ? "&archiviati=1" : ""))]);
    data = { s, lic: l.licenze, req: r.richieste, ev: e.avvisi.slice().reverse() };
    $("#conn").textContent = "Collegato · " + new Date().toLocaleTimeString("it-IT");
    const open = data.req.filter(x => x.status === "open" || x.status === "pending").length;
    $("#nreq").innerHTML = open ? `<span class="badge">${open}</span>` : "";
  } catch (e) { $("#conn").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  render();
}
window.adminRefresh = adminRefresh;

function render() {
  const m = $("#main");
  if (view === "impostazioni") return renderSettings(m);
  if (!data.s) { m.innerHTML = `<p class="muted">Collegamento al server delle licenze...</p>`; return; }
  if (view === "panoramica") {
    const s = data.s;
    m.innerHTML = `<div class="cards">${[["Licenze attive", s.licenze], ["PC attivi", s.pc], ["Cellulari attivi", s.cellulari], ["Richieste aperte", s.richieste_aperte], ["Avvisi non letti", s.avvisi_non_letti]]
      .map(([l, n]) => `<div class="card"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("")}</div>
      <div class="toolbar"><h3 style="margin:0">${evArch ? "Archivio" : "Avvisi"}</h3><span class="grow"></span>
        <span class="muted">Raggruppa per</span><div class="seg">${[["giorno", "Giorno"], ["mese", "Mese"], ["anno", "Anno"]].map(([k, l]) => `<button data-mode="${k}" class="${evMode === k ? "on" : ""}">${l}</button>`).join("")}</div>
        <select id="evt"><option value="">Tutti i tipi</option>${[...new Set(data.ev.map(e => e.kind))].map(k => `<option value="${esc(k)}" ${evType === k ? "selected" : ""}>${esc(KIND[k] || k)}</option>`).join("")}</select>
        <label style="display:flex;gap:6px;align-items:center;color:var(--fg)"><input type="checkbox" id="evarch" ${evArch ? "checked" : ""}> archivio</label></div>
      <div id="groups"></div>`;
    m.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { evMode = b.dataset.mode; setPref("gruppi", evMode); render(); });
    $("#evt").onchange = e => { evType = e.target.value; drawGroups(); };
    $("#evarch").onchange = e => { evArch = e.target.checked; data.ev = []; drawGroups(); adminRefresh(); };
    drawGroups();
  }
  if (view === "licenze") {
    const rows = licRows().map(l => {
      const devs = l.dispositivi.filter(d => d.status === "active");
      return `<tr class="${picked.has(l.key) ? "picked" : ""}"><td><input type="checkbox" class="pk" data-k="${esc(l.key)}" ${picked.has(l.key) ? "checked" : ""}></td><td><span class="mono">${esc(l.key)}</span><br><span class="st ${l.status}">${STATO[l.status]}</span>${l.replaced_by ? ` <span class="muted">→ ${esc(l.replaced_by)}</span>` : ""}</td>
        <td><b>${esc(l.customer)}</b><br><span class="muted">${esc(l.email)}</span>${l.notes ? `<br><span class="muted">${esc(l.notes)}</span>` : ""}</td>
        <td>PC ${devs.filter(d => d.kind === "pc").length}/${l.max_pc}<br>Cell. ${devs.filter(d => d.kind === "mobile").length}/${l.max_mobile}</td>
        <td class="muted">creata ${fmt(l.created)}<br>${l.prima_attivazione ? "1ª attivazione " + fmt(l.prima_attivazione) : "mai attivata"}${l.expires ? "<br>scade " + esc(l.expires.slice(0, 10)) : ""}</td>
        <td><button class="b" onclick="copyKey('${l.key}')">Copia</button><button class="b" onclick="mailLic('${l.key}')">Email</button>${l.status === "active" ? `<button class="b" onclick="editLic('${l.key}')">Modifica</button><button class="b" onclick="act('${l.key}','replace','Generare una chiave nuova? Questa smettera\\' di funzionare su tutti i dispositivi.')">Nuova chiave</button><button class="b d" onclick="act('${l.key}','revoke','Revocare la licenza? Tutte le app si bloccano.')">Revoca</button>` : l.status === "revoked" ? `<button class="b" onclick="act('${l.key}','reactivate')">Riattiva</button>` : ""}<button class="b d" onclick="delLic(['${l.key}'])">Elimina</button></td></tr>`
        + devs.map(d => `<tr class="sub"><td></td><td></td><td colspan="2">${d.kind === "pc" ? "PC" : "Cellulare"} · <b>${esc(d.name || "-")}</b> <span class="muted">${esc(d.version)}</span></td><td class="muted">attivato ${fmt(d.activated)}<br>ultimo uso ${fmt(d.last_seen)}</td><td><button class="b d" onclick="freeDev(${d.id})">Libera</button></td></tr>`).join("");
    }).join("");
    m.innerHTML = `<form class="new" onsubmit="return newLic(event)"><label>Cliente<input name="customer" required></label><label>Email<input name="email" type="email"></label>
      <label>PC<input name="max_pc" type="number" value="1" min="1"></label><label>Cellulari<input name="max_mobile" type="number" value="2" min="0"></label>
      <label>Note<input name="notes"></label><button class="b p" style="height:32px">Crea licenza</button></form>
      <div class="toolbar"><input id="flt" placeholder="Cerca cliente, chiave, email" value="${esc(licQuery)}" style="width:260px">
        <select id="lfl"><option value="">Attive e revocate</option><option value="prova">Prova / test / collaudo</option><option value="revocate">Solo revocate</option><option value="mai">Mai attivate</option><option value="sostituite">Sostituite (chiavi vecchie)</option></select>
        ${licFilter ? "" : `<label style="display:flex;gap:6px;align-items:center;color:var(--fg)"><input type="checkbox" id="all" ${showAll ? "checked" : ""}> anche sostituite</label>`}
        <span class="grow"></span><span class="muted">Ordina per</span><select id="srt"><option value="created">Data di creazione</option><option value="first">Prima attivazione</option><option value="name">Nome</option></select>
        <button class="b" id="dir">${sortBy === "name" ? (sortDir < 0 ? "A → Z" : "Z → A") : (sortDir < 0 ? "Piu' recenti prima" : "Meno recenti prima")}</button></div>
      <div class="toolbar" id="selbar" style="${picked.size ? "" : "display:none"}"><b>${picked.size} selezionate</b><button class="b d" onclick="delLic([...picked])">Elimina selezionate</button><button class="b" onclick="picked.clear();render()">Deseleziona</button></div>
      <table id="lt"><thead><tr><th><input type="checkbox" id="pkall" title="Seleziona tutte quelle in elenco"></th><th>Chiave</th><th>Cliente</th><th>Dispositivi</th><th>Date</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="6" class="muted">Nessuna licenza</td></tr>`}</tbody></table>`;
    $("#lfl").value = licFilter; $("#srt").value = sortBy;
    $("#flt").oninput = e => { licQuery = e.target.value; const pos = e.target.selectionStart; render(); const f = $("#flt"); f.focus(); f.setSelectionRange(pos, pos); };
    $("#all")?.addEventListener("change", e => { showAll = e.target.checked; render(); });
    $("#lfl").onchange = e => { licFilter = e.target.value; render(); };
    $("#srt").onchange = e => { sortBy = e.target.value; sortDir = -1; setPref("ordina", sortBy); setPref("verso", sortDir); render(); };
    $("#dir").onclick = () => { sortDir = -sortDir; setPref("verso", sortDir); render(); };
    m.querySelectorAll(".pk").forEach(c => c.onchange = () => { if (c.checked) picked.add(c.dataset.k); else picked.delete(c.dataset.k); render(); });
    const vis = licRows().map(l => l.key);
    $("#pkall").checked = vis.length > 0 && vis.every(k => picked.has(k));
    $("#pkall").onchange = e => { vis.forEach(k => e.target.checked ? picked.add(k) : picked.delete(k)); render(); };
  }
  if (view === "richieste") {
    m.innerHTML = `<table><thead><tr><th>Data</th><th>Cliente</th><th>Tipo</th><th>Messaggio</th><th>Stato</th><th></th></tr></thead><tbody>${data.req.map(r => `<tr>
      <td class="muted">${fmt(r.created)}</td><td>${esc(r.customer || r.license_key)}<br><span class="muted mono">${esc(r.license_key)}</span></td>
      <td>${r.type === "change" ? "Cambio dispositivo" : "Segnalazione"}${r.device_name ? `<br><span class="muted">da ${esc(r.device_name)}</span>` : ""}</td>
      <td>${esc(r.message)}${r.new_key ? `<br>nuova chiave <span class="mono">${esc(r.new_key)}</span>` : ""}</td><td><span class="st ${r.status}">${STATO[r.status]}</span></td>
      <td>${r.status === "pending" ? `<button class="b p" onclick="reqAct(${r.id},'approve')">Approva</button>` : ""}${r.status === "open" || r.status === "pending" ? `<button class="b" onclick="reqAct(${r.id},'close')">Chiudi</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="6" class="muted">Nessuna richiesta</td></tr>`}</tbody></table>`;
  }
}
// ---- avvisi raggruppati per giorno / mese / anno
function groupOf(e) {
  const d = new Date(e.created.replace(" ", "T") + "Z"), y = d.getFullYear(), mo = String(d.getMonth() + 1).padStart(2, "0"), da = String(d.getDate()).padStart(2, "0");
  if (evMode === "anno") return [String(y), String(y)];
  if (evMode === "mese") return [`${y}-${mo}`, d.toLocaleDateString("it-IT", { month: "long", year: "numeric" })];
  const same = (a, b) => a.toDateString() === b.toDateString();
  return [`${y}-${mo}-${da}`, same(d, new Date()) ? "Oggi" : same(d, new Date(Date.now() - 86400000)) ? "Ieri" : d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long", year: "numeric" })];
}
function drawGroups() {
  const box = $("#groups"); if (!box) return;
  const groups = [];
  for (const e of data.ev.filter(e => !evType || e.kind === evType).sort((a, b) => (a.created < b.created ? 1 : a.created > b.created ? -1 : b.id - a.id))) { const [k, label] = groupOf(e); let g = groups.at(-1); if (!g || g.k !== k) groups.push(g = { k, label, items: [] }); g.items.push(e); }
  const noState = !pref("aperti", null);
  box.innerHTML = groups.map((g, i) => { const unread = g.items.filter(e => !e.read).length, open = openGroups.has(evMode + ":" + g.k) || (noState && i === 0);
    return `<details class="grp" ${open ? "open" : ""}><summary>${esc(g.label.charAt(0).toUpperCase() + g.label.slice(1))}<span class="n">${g.items.length} avvisi</span>${unread && !evArch ? `<span class="badge">${unread} da leggere</span>` : ""}<span class="grow"></span>
      ${!evArch && unread ? `<button class="b" data-read>Segna come letti</button>` : ""}<button class="b" data-arch>${evArch ? "Ripristina" : "Archivia"}</button></summary>
      ${g.items.map(e => `<div class="ev ${e.read || evArch ? "" : "unread"}"><span class="muted">${fmt(e.created)}</span><b>${esc(KIND[e.kind] || e.kind)}</b><span>${esc(e.text)}</span></div>`).join("")}</details>`; }).join("")
    || `<p class="muted">${evArch ? "Archivio vuoto" : "Nessun avviso"}</p>`;
  box.querySelectorAll("details.grp").forEach((d, i) => {
    const g = groups[i], key = evMode + ":" + g.k, ids = g.items.map(e => e.id);
    d.addEventListener("toggle", () => { if (d.open) openGroups.add(key); else openGroups.delete(key); setPref("aperti", [...openGroups].slice(-300)); });
    d.querySelector("[data-read]")?.addEventListener("click", async ev => { ev.preventDefault(); try { await call("POST", "/admin/events/read", { ids }); g.items.forEach(e => (e.read = 1)); drawGroups(); adminRefresh(); } catch (x) { toast(x.message, true); } });
    d.querySelector("[data-arch]").addEventListener("click", async ev => { ev.preventDefault();
      try { await call("POST", "/admin/events/archive", { ids, archivia: !evArch }); data.ev = data.ev.filter(e => !ids.includes(e.id)); drawGroups(); toast(evArch ? "Avvisi ripristinati" : `${ids.length} avvisi archiviati`); adminRefresh(); }
      catch (x) { toast(x.message, true); } });
  });
}
// ---- licenze: filtri, ordinamento, eliminazione con Annulla
const isTest = l => /prova|test|collaudo|da cancellare/i.test(`${l.customer} ${l.notes}`);
function licRows() {
  const q = licQuery.toLowerCase();
  const rows = data.lic.filter(l => !hiddenKeys.has(l.key)).filter(l => licFilter === "prova" ? isTest(l) : licFilter === "revocate" ? l.status === "revoked" : licFilter === "mai" ? !l.prima_attivazione
    : licFilter === "sostituite" ? l.status === "replaced" : (showAll || l.status === "active" || l.status === "revoked"))
    .filter(l => `${l.key} ${l.customer} ${l.email} ${l.notes}`.toLowerCase().includes(q));
  const val = l => sortBy === "name" ? (l.customer || "").toLocaleLowerCase("it") : sortBy === "first" ? (l.prima_attivazione || "") : l.created;
  return rows.sort((a, b) => { const x = val(a), y = val(b);
    if (sortBy === "first" && (!x || !y)) return !x && !y ? 0 : !x ? 1 : -1;
    return (x < y ? -1 : x > y ? 1 : 0) * (sortBy === "name" ? -sortDir : sortDir); });
}
function delLic(keys) {
  const inUse = data.lic.filter(l => keys.includes(l.key) && l.dispositivi.some(d => d.status === "active")).length;
  const who = keys.length === 1 ? `la licenza di ${data.lic.find(l => l.key === keys[0])?.customer || keys[0]}` : `${keys.length} licenze`;
  if (!confirm(`Eliminare ${who}?${inUse ? ` ${inUse === 1 && keys.length === 1 ? "E' in uso: i suoi dispositivi smettono" : `${inUse} sono in uso: i loro dispositivi smettono`} di funzionare.` : ""}\n\nHai qualche secondo per annullare.`)) return;
  keys.forEach(k => { hiddenKeys.add(k); picked.delete(k); }); render();
  undoToast(keys.length === 1 ? "Licenza eliminata" : `${keys.length} licenze eliminate`, async () => {
    try { await call("POST", "/admin/licenses/delete", { keys }); } catch (x) { toast(x.message, true); }
    keys.forEach(k => hiddenKeys.delete(k)); adminRefresh();
  }, () => { keys.forEach(k => hiddenKeys.delete(k)); render(); toast("Eliminazione annullata"); });
}
// ---- email con la chiave
let settingsCache = null;
const getSettings = async () => (settingsCache ||= await call("GET", "/admin/settings"));
const fillMail = (t, l, st) => t.replace(/\{(\w+)\}/g, (m, k) => ({ cliente: l.customer || "", chiave: l.key, pc: l.max_pc, cellulari: l.max_mobile, link_setup: st.link_setup, link_telefono: st.link_telefono })[k] ?? m);
async function mailLic(key) {
  const l = data.lic.find(x => x.key === key); if (!l) return;

    <label>A<input id="m-to" value="${esc(l.email)}" placeholder="indirizzo email"></label><label>Oggetto<input id="m-sub" value="${esc(fillMail(st.email.oggetto, l, st))}"></label>
    <label>Testo<textarea id="m-txt" class="mail">${esc(fillMail(st.email.testo, l, st))}</textarea></label>
    <div class="muted">${mc.pronto ? `Si invia da <b>${esc(mc.mittente)}</b>.` : "Invio diretto non configurato (Impostazioni → Email): puoi aprire la mail nel programma di posta."} Il testo preimpostato si cambia in Impostazioni.</div>
    <div class="err" id="m-err"></div>

  document.body.append(back);

function filt() {
  const q = ($("#flt")?.value || "").toLowerCase(), all = $("#all")?.checked;
  let show = false;
  document.querySelectorAll("#lt tbody tr").forEach(tr => {
    if (!tr.classList.contains("sub")) { const t = tr.textContent.toLowerCase(); show = t.includes(q) && (all || tr.querySelector(".st.active, .st.revoked")); }

function editLic(key) {
  const l = data.lic.find(x => x.key === key); if (!l) return;
  const active = k => l.dispositivi.filter(d => d.status === "active" && d.kind === k);
  const back = document.createElement("div"); back.className = "mback";

    <div class="g2"><label>PC abilitati<input id="e-p" type="number" min="1" value="${l.max_pc}"></label><label>Cellulari abilitati<input id="e-m" type="number" min="0" value="${l.max_mobile}"></label></div>
    <div class="muted">In uso: ${active("pc").length} PC e ${active("mobile").length} cellulari. Aumentando, i posti nuovi sono subito disponibili (anche il QR dell'app per PC si aggiorna).</div>
    <div id="e-pick"></div>
    <label>Scadenza (facoltativa)<input id="e-x" type="date" value="${esc((l.expires || "").slice(0, 10))}"></label>
    <label>Note<textarea id="e-n" rows="2">${esc(l.notes)}</textarea></label>
    <div class="err" id="e-err"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="b" id="e-no">Annulla</button><button class="b p" id="e-ok">Salva</button></div></div>`;
  document.body.append(back);
  const q = id => back.querySelector(id);
  const need = () => ({ pc: Math.max(0, active("pc").length - (+q("#e-p").value || 1)), mobile: Math.max(0, active("mobile").length - Math.max(0, +q("#e-m").value || 0)) });
  const draw = () => { const n = need(), keep = new Set([...back.querySelectorAll("#e-pick input:checked")].map(i => +i.value));
    q("#e-pick").innerHTML = ["pc", "mobile"].filter(k => n[k] > 0).map(k => `<div class="pick"><b>${k === "pc" ? "PC" : "Cellulari"}: scegli ${n[k] === 1 ? "quale disattivare" : `quali ${n[k]} disattivare`}</b>
      <span class="muted">Il nuovo limite e' sotto i ${k === "pc" ? "PC" : "cellulari"} gia' attivi. Sui dispositivi scelti l'app si blocca e il posto si libera.</span>
      ${active(k).map(d => `<label><input type="checkbox" value="${d.id}" data-k="${k}" ${keep.has(d.id) ? "checked" : ""}> ${esc(d.name || "-")} <span class="muted">ultimo uso ${fmt(d.last_seen)}</span></label>`).join("")}</div>`).join(""); };
  q("#e-p").oninput = q("#e-m").oninput = draw;
  q("#e-no").onclick = () => back.remove();
  q("#e-ok").onclick = async () => {
    const n = need(), chosen = [...back.querySelectorAll("#e-pick input:checked")];
    for (const k of ["pc", "mobile"]) { const c = chosen.filter(i => i.dataset.k === k).length; if (c < n[k]) { q("#e-err").textContent = `Scegli ancora ${n[k] - c} ${k === "pc" ? "PC" : "cellulari"} da disattivare.`; return; } }
    const body = { customer: q("#e-c").value.trim(), email: q("#e-e").value.trim(), notes: q("#e-n").value.trim(), max_pc: Math.max(1, +q("#e-p").value || 1),
      max_mobile: Math.max(0, +q("#e-m").value || 0), expires: q("#e-x").value || "", free: chosen.map(i => +i.value) };
    if (body.free.length && !confirm(`Disattivare ${body.free.length} dispositivi? Su quei dispositivi l'app si blocca.`)) return;
    try { const r = await call("POST", `/admin/licenses/${encodeURIComponent(key)}/update`, body); back.remove(); toast(r.liberati ? `Licenza aggiornata: ${r.liberati} dispositivi disattivati` : "Licenza aggiornata"); adminRefresh(); }
    catch (x) { q("#e-err").textContent = x.message; }
  };
}

async function reqAct(id, what) { try { const r = await call("POST", `/admin/requests/${id}/${what}`, {}); if (r.key) { await window.pywebview.api.copy(r.key); toast("Approvato: nuova chiave copiata " + r.key); } else toast("Fatto"); adminRefresh(); } catch (x) { toast(x.message, true); } }
async function readAll() { const last = Math.max(0, ...data.ev.map(e => e.id)); try { await call("POST", "/admin/events/read", { upto: last }); adminRefresh(); } catch (x) { toast(x.message, true); } }

const MAIL_PRESET = { gmail: { server: "smtp.gmail.com", porta: 587, sicurezza: "starttls" }, m365: { server: "smtp.office365.com", porta: 587, sicurezza: "starttls" },
  outlook: { server: "smtp-mail.outlook.com", porta: 587, sicurezza: "starttls" } };
async function loadMail() {

      <label>Utente<input id="mc-user" value="${esc(c.utente)}" placeholder="di solito l'indirizzo"></label>
      <label style="grid-column:1/-1">Password${c.password_salvata ? " (salvata: lascia vuoto per non cambiarla)" : ""}<input id="mc-pw" type="password" autocomplete="new-password"></label></div>

  const cfg = () => ({ preset: $("#mc-p").value, mittente: $("#mc-from").value.trim(), server: $("#mc-srv").value.trim(), porta: +$("#mc-port").value || 587, sicurezza: $("#mc-sec").value,

async function loadNotify() {

    box.querySelectorAll("[data-n]").forEach(i => i.onchange = async () => {
      const n = Object.fromEntries([...box.querySelectorAll("[data-n]")].map(x => [x.dataset.n, x.checked]));
      try { await call("POST", "/admin/settings", { notifiche: n }); toast(i.checked ? "Notifica attivata" : "Notifica disattivata"); } catch (x) { i.checked = !i.checked; toast(x.message, true); }
    });

let pairTimer = 0;
async function newPair() {
  const box = $("#pair");
  try {
    const r = await call("POST", "/admin/pair", {});
    let src = await window.pywebview.api.qr_lib(), svg = "";
    if (src) {
      const qrcode = (await import(URL.createObjectURL(new Blob([src], { type: "text/javascript" })))).default;
      const q = qrcode(0, "M"); q.addData(r.url); q.make();
      const n = q.getModuleCount(); let d = "";
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) d += `M${x + 2} ${y + 2}h1v1h-1z`;
      svg = `<svg viewBox="0 0 ${n + 4} ${n + 4}" width="190" height="190" shape-rendering="crispEdges"><path d="${d}" fill="#111"/></svg>`;
    }
    box.innerHTML = `<div class="pair">${svg ? `<div class="qr">${svg}</div>` : ""}<div style="display:grid;gap:8px"><span class="muted">Codice di 6 cifre</span><span class="code">${esc(r.codice)}</span>
      <span class="muted" id="pair-left"></span><div><button class="b" onclick="window.pywebview.api.copy('${esc(r.indirizzo)}');toast('Indirizzo copiato')">Copia indirizzo dell'app</button></div></div></div>`;
    clearInterval(pairTimer);
    const tick = () => { const s = Math.round((r.scade - Date.now()) / 1000); const el = $("#pair-left"); if (!el) return clearInterval(pairTimer);
      if (s <= 0) { clearInterval(pairTimer); box.innerHTML = `<p class="muted">Codice scaduto: generane uno nuovo.</p>`; } else el.textContent = `Valido ancora ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
    tick(); pairTimer = setInterval(tick, 1000);
  } catch (x) { toast(x.message, true); }
}
