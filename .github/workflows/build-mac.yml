# App per Mac (Apple Silicon), NON firmata: "MB Visual.app" in un .dmg caricato come artefatto del workflow.
# Parte con un push su main o mac-build (non per le sole modifiche ai .md) oppure a mano: Actions -> Build Mac -> Run workflow.
# Una build nuova annulla quella in corso sullo stesso ramo. Attenzione: se il repository diventa privato i minuti
# dei runner macOS costano 10 volte quelli Linux.
name: Build Mac

on:
  push:
    branches: [main, mac-build]
    paths-ignore: ['**.md', 'avanzamento/**', 'docs/**']
  workflow_dispatch:
    inputs:
      onlyoffice:
        description: "Includere l'editor ONLYOFFICE (circa 500 MB, +15 minuti)"
        type: boolean
        default: true
      navisworks:
        description: "Compilare il lettore Navisworks nwd2mbv"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-14   # arm64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dipendenze Python
        run: |
          python -m pip install --upgrade pip
          # se un pacchetto non ha la versione per macOS arm64 si installano gli altri uno per uno (la build va avanti)
          if ! python -m pip install -r requirements.txt; then
            grep -v '^[[:space:]]*#' requirements.txt | sed 's/[[:space:]]*#.*//' | grep -v '^[[:space:]]*$' | while read -r req; do
              python -m pip install "$req" || echo "::warning::NON INSTALLATO: $req"
            done
          fi
          python -m pip install playwright

      - name: Import dei moduli (nessuna dipendenza da Windows)
        run: |
          python - <<'PY'
          import importlib, pkgutil, mbvisual
          for m in pkgutil.iter_modules(mbvisual.__path__):
              importlib.import_module(f"mbvisual.{m.name}")
              print("ok", m.name)
          from mbvisual import license, paths, update
          print("impronta:", license.device_id()[:8], "dati:", paths.DATA_DIR)
          print("strumenti:", paths.tools_status())
          print("aggiornamento:", update.check()["stato"])
          PY

      - name: Librerie JavaScript (ui/vendor)
        run: python tools/fetch_vendor.py

      - name: Lettore Navisworks (nwd2mbv)
        if: ${{ github.event_name == 'push' || inputs.navisworks }}
        continue-on-error: true
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] && export DEVELOPER_DIR="$XC/Contents/Developer" && echo "Xcode: $XC"
          clang++ --version | head -1
          bash tools/nwd2mbv/build_mac.sh

      - uses: actions/setup-node@v4
        if: ${{ github.event_name == 'push' || inputs.onlyoffice }}
        with:
          node-version: "24"

      - name: ONLYOFFICE (github.com/ranuts/document, stesso commit della versione Windows)
        if: ${{ github.event_name == 'push' || inputs.onlyoffice }}
        continue-on-error: true
        run: |
          corepack enable
          git clone https://github.com/ranuts/document.git ~/.mbvisual/src/oo-document
          cd ~/.mbvisual/src/oo-document
          git checkout 7bf478b7deb10cff49bdedc1d5c6db418d3673bf
          pnpm install
          pnpm run build
          rm -rf ~/.mbvisual/onlyoffice && cp -R dist ~/.mbvisual/onlyoffice

      - name: App e disco
        run: python tools/build_mac.py --out dist-mac

      - name: Prove su macOS (OCR, conversioni, stampanti, file di esempio aperti in WebKit)
        continue-on-error: true
        run: |
          mkdir -p ~/.mbvisual/mbvocr && cp ~/.mbvisual/build-mac/stage/bin/mbvocr ~/.mbvisual/mbvocr/
          python -m playwright install webkit
          python tests/mac_smoke.py mac-prove

      - name: Prova di avvio (server locale, /api/update_check e /api/license/status)
        run: |
          APP="dist-mac/MB Visual.app/Contents/MacOS/MB Visual"
          "$APP" --browser --no-open > dist-mac/avvio.log 2>&1 &
          for i in $(seq 1 90); do URL=$(grep -m1 '^http' dist-mac/avvio.log || true); [ -n "$URL" ] && break; sleep 1; done
          cat dist-mac/avvio.log
          cat ~/Library/Logs/MBVisual.log 2>/dev/null || true
          [ -n "$URL" ] || { echo "l'app non ha avviato il server"; exit 1; }
          BASE="${URL%%/?t=*}"; TOKEN="${URL##*t=}"
          curl -sf "$URL" > /dev/null
          curl -sf "$BASE/api/update_check?t=$TOKEN"; echo
          curl -sf "$BASE/api/license/status?t=$TOKEN"; echo
          kill %1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MBVisual-mac-dmg
          path: dist-mac/*.dmg
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MBVisual-mac-zip
          path: dist-mac/*.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prove-mac
          path: |
            dist-mac/avvio.log
            mac-prove/
          if-no-files-found: ignore
          retention-days: 14
