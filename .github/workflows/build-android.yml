# App Android di MB Desk (it.mbgroup.app): APK firmato (+ AAB per Google Play) come artefatto del workflow.
# Avvio a mano. Chiave di firma nei secret MBD_KEYSTORE_B64 / MBD_KEYSTORE_PASSWORD (originale in %USERPROFILE%\.mbvisual\licenze).
name: Build Android
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Versione (la stessa dell'app per PC)
        id: ver
        run: |
          V=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app.py | head -1)
          IFS=. read -r A B C <<< "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((A * 10000 + B * 100 + C))" >> "$GITHUB_OUTPUT"

      - name: Capacitor
        working-directory: android-app
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: Firma
        env:
          KS: ${{ secrets.MBD_KEYSTORE_B64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/mbdesk.p12"

      - name: APK e AAB
        working-directory: android-app/android
        env:
          MBD_KEYSTORE: ${{ runner.temp }}/mbdesk.p12
          MBD_KEYSTORE_PASSWORD: ${{ secrets.MBD_KEYSTORE_PASSWORD }}
          MBD_KEY_ALIAS: mbdesk
          MBD_VERSION: ${{ steps.ver.outputs.version }}
          MBD_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p ../../dist-android
          cp app/build/outputs/apk/release/app-release.apk "../../dist-android/MBDesk-${MBD_VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../../dist-android/MBDesk-${MBD_VERSION}.aab"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "../../dist-android/MBDesk-${MBD_VERSION}.apk" | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: MBDesk-android
          path: dist-android/
          retention-days: 30
