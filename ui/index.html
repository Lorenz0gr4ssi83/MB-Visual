<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MB Visual</title>
<link rel="icon" href="img/logo.png">
<link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- barra del titolo: logo, schede dei documenti, ricerca dei comandi (Ctrl+K) -->
<header class="titlebar">
  <div class="tb-mark"><img src="img/logo-small.png" alt="MB Visual"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <button id="btn-palette" class="omni" title="Cerca comandi, file e formati (Ctrl+K)" data-i18n-title="pal.titolo"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span data-i18n="pal.cerca">Cerca comandi, file e formati</span><kbd>Ctrl+K</kbd></button>
</header>

<!-- barra comandi: File, Apri, comandi sul file attivo, strumenti del visualizzatore -->
<header class="cmdbar">
  <div class="group">
    <div class="menu-wrap">
      <button id="btn-file" class="cmd" title="File: nuovo, salva, salva con nome, aggiornamenti" data-i18n-title="idx.file_nuovo_salva_salva_nome"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></svg><span data-i18n="idx.file">File</span><svg class="caret" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></button>
      <div class="menu" id="menu-file" hidden></div>
    </div>
    <div class="menu-wrap">
      <button id="btn-open" class="cmd primary-cmd" title="Apri (Ctrl+O)" data-i18n-title="idx.apri_ctrl"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg><span data-i18n="idx.apri">Apri</span><svg class="caret" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></button>
      <div class="menu" id="menu-open" hidden></div>
    </div>
  </div>
  <div class="group">
    <div class="menu-wrap">
      <button id="btn-as" class="cmd" title="Apri il file con un altro visualizzatore compatibile" data-i18n-title="idx.apri_file_altro_visualizzatore_compatibile" disabled><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-i18n="idx.apri_come">Apri come</span><svg class="caret" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></button>
      <div class="menu" id="menu-as" hidden></div>
    </div>
    <button id="btn-info" class="cmd" title="Proprieta' del file e impronta SHA-256" data-i18n-title="idx.proprieta_file_impronta_sha_256" disabled><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span data-i18n="idx.proprieta">Proprieta'</span></button>
    <button id="btn-folder" class="cmd desktop-only" title="Mostra il file in Esplora risorse" data-i18n-title="idx.mostra_file_esplora_risorse" disabled><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3zM12 12v4M10 14h4"/></svg><span data-i18n="idx.cartella">Cartella</span></button>
    <button id="btn-external" class="cmd desktop-only" title="Apri il file con il programma predefinito di Windows" data-i18n-title="idx.apri_file_programma_predefinito_windows" disabled><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg><span data-i18n="idx.apri_programma_predefinito">Apri con programma predefinito</span></button>
  </div>
  <div class="group" id="ctx-tools"></div>
  <span class="grow"></span>
  <div class="crumb" id="crumb"></div>
</header>

<div class="workspace" id="workspace">
  <!-- barra laterale: pannelli comuni (Cloud si aggiunge dopo Esplora: ui/js/cloud.js) -->
  <nav class="rail" id="rail">
    <button id="btn-home" title="Home" data-i18n-title="app.home"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v9H4zM10 20v-5h4v5"/></svg></button>
    <button id="btn-explorer" class="desktop-only" title="Esplora una cartella di progetto" data-i18n-title="idx.esplora_cartella_progetto"><svg viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3zM3 10h18"/></svg><span data-i18n="idx.esplora">Esplora</span></button>
    <button id="btn-search" class="desktop-only" title="Cerca nel contenuto di tutti i file della cartella (Ctrl+Maiusc+F)" data-i18n-title="search.cerca_titolo"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v5M14 3v4h4M6 3v18h6"/><circle cx="16.5" cy="16.5" r="3.5"/><path d="M19 19l2.5 2.5"/></svg></button>
    <button id="btn-formats" title="Elenco completo dei formati supportati" data-i18n-title="idx.elenco_completo_formati_supportati"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span data-i18n="idx.formati">Formati</span></button>
    <span class="spacer"></span>
    <button id="btn-keys" title="Scorciatoie da tastiera (F1)" data-i18n-title="app.scorciatoie_tastiera"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
    <button id="btn-theme" title="Tema chiaro / scuro" data-i18n-title="idx.tema_chiaro_scuro"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
  </nav>
  <aside class="explorer" id="explorer" hidden>
    <div class="ex-head">
      <span class="label" data-i18n="idx.cartella_progetto">Cartella di progetto</span>
      <button class="mini" id="ex-pick" title="Scegli la cartella" data-i18n-title="idx.scegli_cartella" data-i18n="idx.scegli">Scegli</button>
      <button class="mini" id="ex-up" title="Cartella superiore" data-i18n-title="idx.cartella_superiore" data-i18n="idx.su">Su</button>
      <button class="mini" id="ex-search" title="Cerca nel contenuto di tutti i file della cartella (Ctrl+Maiusc+F)" data-i18n-title="search.cerca_titolo" data-i18n="search.cerca">Cerca</button>
    </div>
    <div class="ex-path" id="ex-path" data-i18n="idx.nessuna_cartella_aperta">Nessuna cartella aperta</div>
    <input class="ex-filter" id="ex-filter" type="search" placeholder="Filtra per nome o estensione" data-i18n-ph="idx.filtra_nome_estensione">
    <div class="ex-list" id="ex-list"></div>
  </aside>
  <section class="main">
    <main id="stage">
      <section id="home" class="home">
        <div class="home-in">
          <div class="hero" id="drop">
            <span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
            <div class="logo-wrap">
              <div class="halo"></div>
              <span class="cross" style="left:-40px;top:-40px"></span><span class="cross" style="right:-40px;top:-40px"></span>
              <span class="cross" style="left:-40px;bottom:-40px"></span><span class="cross" style="right:-40px;bottom:-40px"></span>
              <svg class="dim" viewBox="0 0 260 20" style="left:0;top:-30px;width:260px;height:20px" aria-hidden="true"><path d="M.5 2v16M259.5 2v16M.5 10h259"/><path class="ar" d="M.5 10l7-3v6zM259.5 10l-7-3v6z"/></svg>
              <span class="dim-label">MB GROUP</span>
              <svg class="dim" viewBox="0 0 20 260" style="right:-32px;top:0;width:20px;height:260px" aria-hidden="true"><path d="M2 .5h16M2 259.5h16M10 .5v259"/><path class="ar" d="M10 .5l-3 7h6zM10 259.5l-3-7h6z"/></svg>
              <img src="img/logo-512.png" alt="Logo MB Visual" data-i18n-alt="idx.logo_mb_visual" class="hero-logo">
            </div>
            <h1 data-i18n="idx.trascina_qui_i_file_aprire">Trascina qui i file da aprire</h1>
            <p data-i18n="idx.documenti_disegni_cad_modelli_3d">Documenti, disegni CAD, modelli 3D e BIM, firme digitali, immagini, video e archivi. Anche piu' file insieme.</p>
            <div class="hero-actions">
              <button class="btn primary" id="home-open"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg><span data-i18n="idx.apri_file">Apri file</span><kbd>Ctrl+O</kbd></button>
              <button class="btn" id="home-new"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4M12 11v6M9 14h6"/></svg><span data-i18n="idx.crea_nuovo">Crea nuovo</span><kbd>Ctrl+N</kbd></button>
              <button class="btn desktop-only" id="home-folder"><svg viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3zM3 10h18"/></svg><span data-i18n="idx.apri_cartella_progetto">Apri cartella di progetto</span></button>
            </div>
            <div class="drop-note" id="home-note"></div>
          </div>
          <div class="new-row" id="home-newrow"></div>
          <div class="home-keys" id="home-keys"></div>
        </div>
      </section>
      <section id="formats" class="formats" hidden></section>
      <div id="views"></div>
    </main>
  </section>
</div>

<footer class="statusbar">
  <span class="st-dot"></span>
  <span id="st-path" data-i18n="idx.pronto">Pronto</span>
  <span class="grow"></span>
  <span id="st-extra" class="mono"></span>
  <span id="st-type"></span>
  <span id="st-size" class="mono"></span>
  <span id="st-version" class="mono" title="Versione di MB Visual" data-i18n-title="idx.versione_mb_visual"></span>
</footer>
<div class="overlay" id="dragover" hidden><div data-i18n="idx.rilascia_aprire">Rilascia per aprire</div></div>
<div class="modal-back" id="modal" hidden><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast" hidden></div>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
